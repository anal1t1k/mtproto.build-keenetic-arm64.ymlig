
name: Build Keenetic ARM64 diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: sleep3r/mtproto.zig
          ref: v1.15.4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Patch curl executable
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/proxy/http_fetch.zig")
          s = p.read_text()

          s, n1 = re.subn(
              r'(?m)^(\s*)"curl",$',
              r'\1"/opt/bin/curl",',
              s,
              count=1
          )
          s, n2 = re.subn(
              r'(\{\s*)"curl",',
              r'\1"/opt/bin/curl",',
              s,
              count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(
                  f"curl patch failed: standalone={n1}, array={n2}"
              )

          if s.count('"/opt/bin/curl"') < 2:
              raise SystemExit("Absolute curl path verification failed.")

          p.write_text(s)
          print("Both curl paths patched.")
          PY

      - name: Disable env wrapper for diagnosis
        shell: bash
        run: |
          set -eu
          cat > src/proxy/child_process.zig <<'ZIG'
          const std = @import("std");

          pub fn run(
              allocator: std.mem.Allocator,
              io: std.Io,
              requested: std.process.RunOptions,
          ) !std.process.RunResult {
              var options = requested;

              if (options.timeout == .none) {
                  options.timeout = .{
                      .duration = .{
                          .raw = .fromSeconds(12),
                          .clock = .awake,
                      },
                  };
              }

              return std.process.run(allocator, io, options);
          }
          ZIG

          echo "Diagnostic wrapper removed."
          cat src/proxy/child_process.zig

      - name: Verify diagnostic patches
        shell: bash
        run: |
          set -eu
          grep -n '"/opt/bin/curl"' src/proxy/http_fetch.zig
          grep -n 'return std.process.run' src/proxy/child_process.zig
          if grep -q '/opt/bin/env' src/proxy/child_process.zig; then
            echo "ERROR: env wrapper still present"
            exit 1
          fi

      - name: Build Linux ARM64 binary
        shell: bash
        run: |
          set -eux
          zig version
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-gnu

      - name: Verify binary
        shell: bash
        run: |
          set -eu
          test -f zig-out/bin/mtproto-proxy
          file zig-out/bin/mtproto-proxy
          sha256sum zig-out/bin/mtproto-proxy

      - name: Prepare artifact
        shell: bash
        run: |
          set -eu
          mkdir -p artifact
          cp zig-out/bin/mtproto-proxy artifact/mtproto-proxy-linux-aarch64
          cp src/proxy/http_fetch.zig artifact/
          cp src/proxy/child_process.zig artifact/
          sha256sum artifact/mtproto-proxy-linux-aarch64 > artifact/SHA256SUMS

      - name: Upload diagnostic binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-keenetic-arm64-diagnostic
          path: artifact/
          if-no-files-found: error
