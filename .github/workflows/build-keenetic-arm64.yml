
name: Keenetic ARM64 diagnostic build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Download mtproto.zig v1.15.4
        run: |
          git clone --depth 1 --branch v1.15.4 \
            https://github.com/sleep3r/mtproto.zig.git mtproto-src

      - name: Add spawn diagnostics
        working-directory: mtproto-src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/proxy/http_fetch.zig")
          s = p.read_text()
          s = s.replace('"/usr/bin/curl"', '"/opt/bin/curl"')
          p.write_text(s)

          p = Path("src/proxy/child_process.zig")
          p.write_text(r'''
          const std = @import("std");

          pub fn run(
              allocator: std.mem.Allocator,
              io: std.Io,
              requested: std.process.RunOptions,
          ) !std.process.RunResult {
              var options = requested;

              if (options.timeout == .none) {
                  options.timeout = .{
                      .duration = .{
                          .raw = .fromSeconds(12),
                          .clock = .awake,
                      },
                  };
              }

              std.debug.print(
                  "[mtproxy-diag] spawn argc={d}\n",
                  .{options.argv.len},
              );

              for (options.argv, 0..) |arg, i| {
                  std.debug.print(
                      "[mtproxy-diag] argv[{d}]={s}\n",
                      .{ i, arg },
                  );
              }

              const result = std.process.run(
                  allocator,
                  io,
                  options,
              ) catch |err| {
                  std.debug.print(
                      "[mtproxy-diag] spawn error={s}\n",
                      .{@errorName(err)},
                  );
                  return err;
              };

              return result;
          }
          ''')
          PY

      - name: Build diagnostic binary
        working-directory: mtproto-src
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-gnu
          mkdir -p ../diagnostic
          cp zig-out/bin/mtproto-proxy \
            ../diagnostic/mtproto-proxy-linux-aarch64
          sha256sum ../diagnostic/mtproto-proxy-linux-aarch64 \
            | tee ../diagnostic/SHA256SUMS

      - name: Upload diagnostic binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-keenetic-arm64-diagnostic
          path: diagnostic/
          retention-days: 7
