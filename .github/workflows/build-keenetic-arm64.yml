
name: Build Keenetic ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: sleep3r/mtproto.zig
          ref: v1.15.4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Inspect source
        shell: bash
        run: |
          echo "=== child_process.zig ==="
          grep -n -A 12 -B 3 'allocator.alloc.*options.argv.len' src/proxy/child_process.zig
          echo "=== curl references ==="
          grep -n -B 3 -A 5 '"curl"' src/proxy/http_fetch.zig

      - name: Patch child process PATH
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/proxy/child_process.zig")
          s = p.read_text()

          # Increase argv capacity.
          pattern = r'const argv = try allocator\.alloc\(\[\]const u8, options\.argv\.len \+ 2\);'
          s, n = re.subn(pattern,
                         'const argv = try allocator.alloc([]const u8, options.argv.len + 3);',
                         s, count=1)
          if n != 1:
              raise SystemExit("Could not patch argv allocation.")

          # Find the env arguments and insert PATH after the signal option.
          pattern = r'(?m)^(\s*argv\[1\]\s*=\s*"--default-signal=TERM,INT,HUP,USR1";\s*)$'
          s, n = re.subn(
              pattern,
              r'\1\n          argv[2] = "PATH=/opt/bin:/opt/sbin:/opt/usr/bin:/opt/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin";',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("Could not find the default-signal argv assignment.")

          # Move the original argv copy to index 3.
          pattern = r'@memcpy\(argv\[2\.\.\], options\.argv\);'
          s, n = re.subn(pattern, '@memcpy(argv[3..], options.argv);', s, count=1)
          if n != 1:
              raise SystemExit("Could not find the original argv copy.")

          p.write_text(s)
          print("PATH patch applied.")
          PY

      - name: Build Linux ARM64 binary
        shell: bash
        run: |
          set -eux
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-gnu

      - name: Verify binary
        shell: bash
        run: |
          set -eu
          find zig-out -type f -maxdepth 4 -print
          test -f zig-out/bin/mtproto-proxy
          file zig-out/bin/mtproto-proxy
          sha256sum zig-out/bin/mtproto-proxy

      - name: Prepare artifact
        shell: bash
        run: |
          set -eu
          mkdir -p artifact
          cp zig-out/bin/mtproto-proxy artifact/mtproto-proxy-linux-aarch64
          cp src/proxy/http_fetch.zig artifact/
          cp src/proxy/child_process.zig artifact/
          sha256sum artifact/mtproto-proxy-linux-aarch64 > artifact/SHA256SUMS

      - name: Upload ARM64 binary and patched sources
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-keenetic-arm64
          path: artifact/
          if-no-files-found: error
