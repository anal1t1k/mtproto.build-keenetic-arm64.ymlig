
name: Build Keenetic ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: sleep3r/mtproto.zig
          ref: v1.15.4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Patch curl executable
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/proxy/http_fetch.zig")
          s = p.read_text()

          # Patch the standalone curl executable argument.
          s, n1 = re.subn(
              r'(?m)^(\s*)"curl",$',
              r'\1"/opt/bin/curl",',
              s,
              count=1
          )

          # Patch curl in the argument array used for the fallback check.
          s, n2 = re.subn(
              r'(\{\s*)"curl",',
              r'\1"/opt/bin/curl",',
              s,
              count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(
                  f"curl patch failed: standalone={n1}, array={n2}"
              )

          if s.count('"/opt/bin/curl"') < 2:
              raise SystemExit("Absolute curl path verification failed.")

          p.write_text(s)
          print("Both curl executable paths patched.")
          PY

      - name: Patch child process PATH
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/proxy/child_process.zig")
          s = p.read_text()

          s, n1 = re.subn(
              r'const argv = try allocator\.alloc\(\[\]const u8, options\.argv\.len \+ 2\);',
              'const argv = try allocator.alloc([]const u8, options.argv.len + 3);',
              s,
              count=1
          )
          if n1 != 1:
              raise SystemExit("Could not patch argv allocation.")

          s, n2 = re.subn(
              r'(?m)^(\s*argv\[1\]\s*=\s*"--default-signal=TERM,INT,HUP,USR1";\s*)$',
              r'\1\n          argv[2] = "PATH=/opt/bin:/opt/sbin:/opt/usr/bin:/opt/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin";',
              s,
              count=1
          )
          if n2 != 1:
              raise SystemExit("Could not insert PATH.")

          s, n3 = re.subn(
              r'@memcpy\(argv\[2\.\.\], options\.argv\);',
              '@memcpy(argv[3..], options.argv);',
              s,
              count=1
          )
          if n3 != 1:
              raise SystemExit("Could not move original argv.")

          p.write_text(s)
          print("PATH patch applied.")
          PY

      - name: Verify patches
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          http = Path("src/proxy/http_fetch.zig").read_text()
          child = Path("src/proxy/child_process.zig").read_text()

          if http.count('"/opt/bin/curl"') < 2:
              raise SystemExit("ERROR: absolute curl paths missing")

          if 'PATH=/opt/bin:/opt/sbin:/opt/usr/bin:/opt/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin' not in child:
              raise SystemExit("ERROR: child process PATH missing")

          print("Verified: both curl paths and child process PATH are present.")
          PY

          echo "=== curl paths ==="
          grep -n '"/opt/bin/curl"' src/proxy/http_fetch.zig

          echo "=== child process PATH ==="
          grep -n 'PATH=/opt/bin' src/proxy/child_process.zig

      - name: Build Linux ARM64 binary
        shell: bash
        run: |
          set -eux
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-gnu

      - name: Verify binary
        shell: bash
        run: |
          set -eu
          test -f zig-out/bin/mtproto-proxy
          file zig-out/bin/mtproto-proxy
          sha256sum zig-out/bin/mtproto-proxy

      - name: Prepare artifact
        shell: bash
        run: |
          set -eu
          mkdir -p artifact
          cp zig-out/bin/mtproto-proxy artifact/mtproto-proxy-linux-aarch64
          cp src/proxy/http_fetch.zig artifact/
          cp src/proxy/child_process.zig artifact/
          sha256sum artifact/mtproto-proxy-linux-aarch64 > artifact/SHA256SUMS

      - name: Upload ARM64 binary and patched sources
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-keenetic-arm64
          path: artifact/
          if-no-files-found: error
