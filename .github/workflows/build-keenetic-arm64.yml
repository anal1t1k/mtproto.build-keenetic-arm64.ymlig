
name: Build patched MTProxy for Keenetic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source v1.15.4
        shell: bash
        run: |
          mkdir source
          curl -fL https://github.com/sleep3r/mtproto.zig/archive/refs/tags/v1.15.4.tar.gz -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source

      - name: Patch curl and child process
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Use Entware curl and inherit the process environment.
          p = Path("src/proxy/http_fetch.zig")
          s = p.read_text()

          if s.count('"curl"') != 2:
              raise SystemExit("Unexpected curl source; refusing to build")

          s = s.replace('"curl"', '"/opt/bin/curl"')

          old = 'var io_instance: std.Io.Threaded = .init(std.heap.page_allocator, .{});'
          new = 'var io_instance: std.Io.Threaded = .init(std.heap.page_allocator, .{ .environ = std.Io.Threaded.global_single_threaded.environ.process_environ });'

          if s.count(old) != 2:
              raise SystemExit("Unexpected HTTP fetch IO initializers")

          s = s.replace(old, new)
          p.write_text(s)

          # Use Entware env instead of the missing /usr/bin/env.
          p = Path("src/proxy/child_process.zig")
          s = p.read_text()

          old = 'argv[0] = "/usr/bin/env";'
          if s.count(old) != 1:
              raise SystemExit("Unexpected env executable path")

          s = s.replace(old, 'argv[0] = "/opt/bin/env";')

          old = 'const argv = try allocator.alloc([]const u8, options.argv.len + 2);'
          if s.count(old) != 1:
              raise SystemExit("Unexpected argv allocation")

          s = s.replace(
              old,
              'const argv = try allocator.alloc([]const u8, options.argv.len + 3);'
          )

          old = 'argv[1] = "--default-signal=TERM,INT,HUP,USR1";'
          if s.count(old) != 1:
              raise SystemExit("Unexpected env argument")

          s = s.replace(
              old,
              old + '\n    argv[2] = "PATH=/opt/bin:/opt/sbin:/opt/usr/bin:/opt/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin";'
          )

          old = '@memcpy(argv[2..], options.argv);'
          if s.count(old) != 1:
              raise SystemExit("Unexpected argv copy")

          s = s.replace(old, '@memcpy(argv[3..], options.argv);')
          p.write_text(s)

          print("=== Verify curl paths ===")
          for i, line in enumerate(
              Path("src/proxy/http_fetch.zig").read_text().splitlines(), 1
          ):
              if "/opt/bin/curl" in line:
                  print(f"{i}: {line.strip()}")

          print("=== Verify child process ===")
          for i, line in enumerate(
              Path("src/proxy/child_process.zig").read_text().splitlines(), 1
          ):
              if any(
                  x in line
                  for x in (
                      'argv[0]',
                      'allocator.alloc',
                      'argv[1]',
                      'argv[2]',
                      '@memcpy',
                  )
              ):
                  print(f"{i}: {line.strip()}")
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ARM64 Linux binary
        working-directory: source
        shell: bash
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux -Dcpu=generic

      - name: Prepare artifact
        working-directory: source
        shell: bash
        run: |
          test -f zig-out/bin/mtproto-proxy
          mkdir -p ../artifact
          cp zig-out/bin/mtproto-proxy ../artifact/mtproto-proxy-linux-aarch64
          cd ../artifact
          sha256sum mtproto-proxy-linux-aarch64 > SHA256SUMS.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mtproto-zig-keenetic-arm64
          path: artifact/
          if-no-files-found: error
